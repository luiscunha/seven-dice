name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # A partir da fase 4, é aqui que corre o teste de ida-e-volta do gerador
      # sobre milhares de tabuleiros (spec §9.3). É a verificação que sustenta a
      # garantia de que nenhum nível publicado é impossível.
      - name: Testes
        run: pnpm test
